<section class="nv-page">
  <header class="nv-page-heading"><h1>Detalle de la publicación</h1></header>
  <div class="detalle-container">
    <ng-container *ngIf="dato as publicacion; else sinPublicacion">
      <p *ngIf="publicacion.categoria?.[0]"><strong>Categoría:</strong> {{ publicacion.categoria[0] }}</p>
      <p *ngIf="publicacion.texto">{{ publicacion.texto }}</p>
      <p *ngIf="publicacion.url_web">
        <a [href]="publicacion.url_web" target="_blank" rel="noopener noreferrer">Abrir publicación original</a>
      </p>
    </ng-container>
    <ng-template #sinPublicacion><p>Selecciona una publicación para ver su detalle.</p></ng-template>
    <button type="button" class="nv-button" (click)="goBack()">Volver</button>
  </div>
</section>
